name: Build and publish OSEDA CLI

on:
  push:
    branches:
      - feature/digital-ci-image
  workflow_dispatch:
    inputs:
      publish_edge:
        description: Also update the mutable edge tag
        required: true
        type: boolean
        default: true

concurrency:
  group: digital-image-ghcr
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ghcr.io/phsauter/oseda-cli
  LOCAL_IMAGE: oseda-cli:ci

jobs:
  build-test-publish:
    name: Build, test, and publish amd64
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Define image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail
          source _build/images/iic-osic-tools/digital/version.env
          [[ "${UPSTREAM_VERSION}" =~ ^[0-9]{4}\.[0-9]{2}$ ]]
          [[ "${UPSTREAM_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${IMAGE_VERSION}" == "${UPSTREAM_VERSION}".* ]]
          short_sha="${GITHUB_SHA:0:12}"
          created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "sha_tag=sha-${short_sha}"
            echo "upstream_version=${UPSTREAM_VERSION}"
            echo "upstream_commit=${UPSTREAM_COMMIT}"
            echo "version=${IMAGE_VERSION}"
            echo "created=${created}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify upstream tool baseline
        run: _tests/digital/check_upstream_baseline.sh

      - name: Build and cache digital source-build base
        working-directory: _build
        shell: bash
        run: |
          set -euo pipefail
          docker buildx bake \
            --set digital-build-base.platform=linux/amd64 \
            --set "digital-build-base.cache-from=type=gha,scope=digital-build-base-${{ steps.image.outputs.upstream_version }}-amd64" \
            --set "digital-build-base.cache-to=type=gha,mode=max,scope=digital-build-base-${{ steps.image.outputs.upstream_version }}-amd64" \
            digital-build-base

      - name: Build and cache Yosys
        working-directory: _build
        shell: bash
        run: |
          set -euo pipefail
          docker buildx bake \
            --set digital-build-base.platform=linux/amd64 \
            --set digital-yosys.platform=linux/amd64 \
            --set "digital-build-base.cache-from=type=gha,scope=digital-build-base-${{ steps.image.outputs.upstream_version }}-amd64" \
            --set "digital-yosys.cache-from=type=gha,scope=digital-yosys-${{ steps.image.outputs.upstream_version }}-amd64" \
            --set "digital-yosys.cache-to=type=gha,mode=max,scope=digital-yosys-${{ steps.image.outputs.upstream_version }}-amd64" \
            digital-yosys

      - name: Build digital CLI image
        working-directory: _build
        shell: bash
        run: |
          set -euo pipefail
          build_log="${RUNNER_TEMP}/digital-build.log"
          set +e
          docker buildx bake \
            --set 'digital-*.platform=linux/amd64' \
            --set image-digital-source.platform=linux/amd64 \
            --set "digital-build-base.cache-from=type=gha,scope=digital-build-base-${{ steps.image.outputs.upstream_version }}-amd64" \
            --set "digital-yosys.cache-from=type=gha,scope=digital-yosys-${{ steps.image.outputs.upstream_version }}-amd64" \
            --set "image-digital-source.tags=${LOCAL_IMAGE}" \
            --set "image-digital-source.args.CONTAINER_TAG=${{ steps.image.outputs.version }}" \
            --set "image-digital-source.args.UPSTREAM_VERSION=${{ steps.image.outputs.upstream_version }}" \
            --set "image-digital-source.labels.org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --set "image-digital-source.labels.org.opencontainers.image.revision=${GITHUB_SHA}" \
            --set "image-digital-source.labels.org.opencontainers.image.created=${{ steps.image.outputs.created }}" \
            --set "image-digital-source.labels.io.github.phsauter.oseda-cli.upstream-revision=${{ steps.image.outputs.upstream_commit }}" \
            --set image-digital-source.labels.org.opencontainers.image.title=OSEDA-CLI \
            --set "image-digital-source.cache-from=type=gha,scope=digital-${{ steps.image.outputs.upstream_version }}-amd64" \
            --set "image-digital-source.cache-to=type=gha,mode=max,scope=digital-${{ steps.image.outputs.upstream_version }}-amd64" \
            --load \
            image-digital-source 2>&1 | tee "${build_log}"
          build_status=${PIPESTATUS[0]}
          set -e
          if (( build_status != 0 )); then
            detail="$(
              tail -n 20 "${build_log}" |
                sed 's/%/%25/g; s/\r/%0D/g; s/$/%0A/' |
                tr -d '\n'
            )"
            echo "::error title=Digital BuildKit build failed::${detail}"
            exit "${build_status}"
          fi

      - name: Run functional smoke tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/_tests/digital,dst=/tests,readonly" \
            -e "EXPECT_UPSTREAM_VERSION=${{ steps.image.outputs.upstream_version }}" \
            -e "EXPECT_IMAGE_VERSION=${{ steps.image.outputs.version }}" \
            "${LOCAL_IMAGE}" \
            bash /tests/run_smoke_tests.sh

      - name: Run entrypoint smoke tests
        env:
          CONTAINER_ENGINE: docker
        run: _tests/digital/run_entrypoint_tests.sh "${LOCAL_IMAGE}"

      - name: Measure image
        id: size
        shell: bash
        run: |
          set -euo pipefail
          unpacked_bytes="$(
            docker run --rm --entrypoint du "${LOCAL_IMAGE}" -sbx / |
              awk '{print $1}'
          )"
          docker image save "${LOCAL_IMAGE}" | gzip -1 > "${RUNNER_TEMP}/oseda-cli.tar.gz"
          archive_bytes="$(stat -c '%s' "${RUNNER_TEMP}/oseda-cli.tar.gz")"
          {
            echo "unpacked_bytes=${unpacked_bytes}"
            echo "archive_bytes=${archive_bytes}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push commit tag
        shell: bash
        run: |
          set -euo pipefail
          remote="${REGISTRY_IMAGE}:${{ steps.image.outputs.sha_tag }}"
          docker image tag "${LOCAL_IMAGE}" "${remote}"
          docker image push "${remote}"

      - name: Push version tag
        shell: bash
        run: |
          set -euo pipefail
          remote="${REGISTRY_IMAGE}:${{ steps.image.outputs.version }}"
          docker image tag "${LOCAL_IMAGE}" "${remote}"
          docker image push "${remote}"

      - name: Push edge tag
        if: ${{ github.event_name == 'push' || inputs.publish_edge }}
        shell: bash
        run: |
          set -euo pipefail
          remote="${REGISTRY_IMAGE}:edge"
          docker image tag "${LOCAL_IMAGE}" "${remote}"
          docker image push "${remote}"

      - name: Report result
        shell: bash
        run: |
          set -euo pipefail
          unpacked_mib="$(
            awk 'BEGIN { printf "%.1f", ${{ steps.size.outputs.unpacked_bytes }} / 1048576 }'
          )"
          archive_mib="$(
            awk 'BEGIN { printf "%.1f", ${{ steps.size.outputs.archive_bytes }} / 1048576 }'
          )"
          {
            echo "## OSEDA-CLI image"
            echo
            echo "- Versioned image: \`${REGISTRY_IMAGE}:${{ steps.image.outputs.version }}\`"
            echo "- Immutable image: \`${REGISTRY_IMAGE}:${{ steps.image.outputs.sha_tag }}\`"
            echo "- Upstream tool baseline: \`${{ steps.image.outputs.upstream_version }}\`"
            echo "- Upstream baseline commit: \`${{ steps.image.outputs.upstream_commit }}\`"
            if [[ "${GITHUB_EVENT_NAME}" == "push" || "${{ inputs.publish_edge }}" == "true" ]]; then
              echo "- Test channel: \`${REGISTRY_IMAGE}:edge\`"
            fi
            echo "- Unpacked root filesystem: ${unpacked_mib} MiB"
            echo "- Compressed Docker archive: ${archive_mib} MiB"
            echo
            echo "The compressed archive includes Docker archive metadata and is an"
            echo "approximation of registry transfer size."
          } >> "${GITHUB_STEP_SUMMARY}"
